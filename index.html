  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #7fc4ef; }
  body {
    font-family: 'LilitaOne', "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    user-select: none; touch-action: none;
  }
  #game { display: block; width: 100%; height: 100%; }
  /* 暗角：把视线压到画面中心，画面更聚焦 */
  #vig {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at 50% 42%,
      rgba(0,0,0,0) 22%, rgba(24,4,20,.24) 58%, rgba(10,2,14,.70) 100%);
  }

  /* ================= HUD ================= */
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: 16px 20px; display: flex; justify-content: space-between; align-items: flex-start;
    transition: opacity .25s ease;
  }
  /* 主菜单有自己的资源条，游戏 HUD 要让开 */
  #hud.off { opacity: 0; }
  .hud-score { line-height: 1; }
  .hud-label {
    font-size: 15px; letter-spacing: 2px; color: #ffd76a;
    text-shadow: 0 2px 0 #2b0a22, 0 -2px 0 #2b0a22, 2px 0 0 #2b0a22, -2px 0 0 #2b0a22,
                 2px 2px 0 #2b0a22, -2px 2px 0 #2b0a22, 2px -2px 0 #2b0a22, -2px -2px 0 #2b0a22;
  }
  .hud-value {
    font-size: 56px; color: #fff; letter-spacing: 1px; margin-top: 2px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 3px 0 #2b0a22, 0 -3px 0 #2b0a22, 3px 0 0 #2b0a22, -3px 0 0 #2b0a22,
                 3px 3px 0 #2b0a22, -3px 3px 0 #2b0a22, 3px -3px 0 #2b0a22, -3px -3px 0 #2b0a22,
                 0 9px 0 #1a0614, 0 14px 16px rgba(0,0,0,.35);
  }
  .hud-dist {
    display: inline-block; margin-top: 8px; padding: 3px 12px 4px;
    font-size: 15px; letter-spacing: 1px; color: #fff;
    background: rgba(38,10,32,.72); border-radius: 20px;
    box-shadow: inset 0 0 0 2px rgba(255,180,110,.45), 0 3px 0 rgba(0,0,0,.25);
  }
  .hud-right { display: flex; align-items: center; gap: 10px; }

  .coin-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 18px 6px 8px; border-radius: 40px;
    background: linear-gradient(180deg, rgba(52,14,44,.92), rgba(26,6,22,.95));
    box-shadow: inset 0 0 0 2.5px rgba(255,214,90,.85), 0 5px 0 rgba(0,0,0,.3), 0 10px 20px rgba(0,0,0,.25);
  }
  .coin-pill svg { width: 34px; height: 34px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .coin-pill span {
    font-size: 26px; color: #ffe066; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 #5a3200;
  }

  .btn-pause {
    width: 46px; height: 46px; border: none; border-radius: 14px; cursor: pointer;
    pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 5px;
    background: linear-gradient(180deg, #4aa8e8, #2b6ea8);
    box-shadow: inset 0 0 0 2.5px rgba(160,225,255,.85), 0 5px 0 rgba(0,0,0,.3);
  }
  .btn-pause:active { transform: translateY(3px); box-shadow: inset 0 0 0 2.5px rgba(160,225,255,.85), 0 2px 0 rgba(0,0,0,.3); }
  .btn-pause i { display: block; width: 6px; height: 20px; border-radius: 3px; background: #fff; }

  /* ================= 遮罩 ================= */
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, rgba(46,8,38,.18), rgba(14,2,12,.62));
    transition: opacity .25s ease;
  }
  #overlay.hide { opacity: 0; pointer-events: none; }
  /* ================= 主菜单（全屏） ================= */
  #overlay.menu-mode {
    background: radial-gradient(ellipse at 50% 38%,
      rgba(0,0,0,0) 26%, rgba(20,3,16,.42) 62%, rgba(10,2,14,.78) 100%);
  }
  .menu {
    position: fixed; inset: 0; pointer-events: none;
    font-family: inherit;
  }
  .menu > * { pointer-events: auto; }

  /* 顶部资源条 */
  .res-bar {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 9px;
  }
  .res {
    display: flex; align-items: center; gap: 7px; height: 34px;
    padding: 0 6px 0 6px; border-radius: 17px;
    background: linear-gradient(180deg, rgba(56,14,48,.94), rgba(26,5,22,.96));
    box-shadow: inset 0 0 0 2px rgba(255,190,90,.55), 0 4px 0 rgba(0,0,0,.35);
    color: #fff; font-size: 15px; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 #2b0a22;
  }
  .res b { font-weight: 400; }
  .res .plus {
    width: 22px; height: 22px; line-height: 21px; text-align: center; border-radius: 50%;
    background: linear-gradient(180deg, #ffe066, #f0a81e); color: #5a3200;
    font-size: 16px; text-shadow: none; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.6);
  }
  .ri { width: 20px; height: 20px; border-radius: 50%; display: block; position: relative; }
  .ri-coin {
    background: radial-gradient(circle at 34% 30%, #fff6c0, #ffcf3a 55%, #d68a00);

  /* 左右功能列 */

    position: absolute; right: -4px; top: -6px; font-style: normal;

    background: linear-gradient(180deg, #ffe066, #f0a81e);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55), 0 2px 0 #a86a00;

  /* 侧栏小图标（纯 CSS） */
  .si { width: 34px; height: 34px; border-radius: 11px; position: relative; display: block;
        background: linear-gradient(180deg, rgba(255,214,106,.22), rgba(255,150,60,.12));
        box-shadow: inset 0 0 0 1.5px rgba(255,210,120,.35); }
  .si::before, .si::after { content: ''; position: absolute; }
  .si-char::before { left: 50%; top: 7px; width: 12px; height: 12px; margin-left: -6px;
    border-radius: 50%; background: #ffd98a; }
  .si-char::after { left: 50%; bottom: 6px; width: 18px; height: 11px; margin-left: -9px;
    border-radius: 8px 8px 4px 4px; background: #ffd98a; }
  .si-shop::before { left: 50%; top: 11px; width: 18px; height: 14px; margin-left: -9px;
    border-radius: 3px 3px 5px 5px; background: #ffd98a; }
  .si-shop::after { left: 50%; top: 7px; width: 10px; height: 8px; margin-left: -5px;
    border: 2.5px solid #ffd98a; border-bottom: none; border-radius: 6px 6px 0 0; }
  .si-rank::before { left: 9px; bottom: 8px; width: 5px; height: 9px; border-radius: 2px; background: #ffd98a; }
  .si-rank::after { left: 15px; bottom: 8px; width: 5px; height: 15px; border-radius: 2px; background: #ffd98a;
    box-shadow: 6px 4px 0 0 #ffd98a; }
  .si-treasure::before { left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    background: #ffd98a; transform: rotate(45deg); border-radius: 3px; }
  .si-vs::before { left: 50%; top: 50%; width: 4px; height: 20px; margin: -10px 0 0 -2px;
    background: #ffd98a; transform: rotate(45deg); border-radius: 2px; }
  .si-vs::after { left: 50%; top: 50%; width: 4px; height: 20px; margin: -10px 0 0 -2px;
    background: #ffd98a; transform: rotate(-45deg); border-radius: 2px; }
  .si-club::before { left: 8px; top: 9px; width: 11px; height: 11px; border-radius: 50%; background: #ffd98a; }
  .si-club::after { left: 16px; bottom: 8px; width: 11px; height: 11px; border-radius: 50%; background: #ffd98a;
    box-shadow: -9px 3px 0 -1px #ffd98a; }

  /* 中间 logo */

  /* 底部开跑 */
  .run-btn {
    position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%);
    padding: 14px 62px 16px; border: none; border-radius: 22px; cursor: pointer;
    font-family: inherit; font-size: 30px; letter-spacing: 4px; color: #fff8e0;
    background: linear-gradient(180deg, #ffd23f 0%, #f59a14 52%, #d4760a 100%);

  .start-tools { display: flex; gap: 10px; margin-top: 12px; }
  .tool-btn {
    flex: 1; padding: 10px 0 11px; border: none; border-radius: 16px; cursor: pointer;

  .panel-title {

  .ch-card .tag.buy { color: #ffd23f; }

  /* 用纯 CSS 拼的小人：帽子 / 头 / 上身 / 两条腿 */
  .ch-fig { position: relative; width: 44px; height: 54px; margin: 0 auto; }
  .ch-fig span { position: absolute; display: block; }
  .ch-fig .f-cap {
    left: 50%; top: 0; width: 31px; height: 17px; margin-left: -15.5px;

  }
  .ch-fig .f-cap::after {

    margin-left: -10.5px; border-radius: 7px 7px 0 0; background: var(--cap2);
  }
  .ch-fig .f-head {
    left: 50%; top: 8px; width: 27px; height: 27px; margin-left: -13.5px;
    border-radius: 50%; background: var(--skin);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.08);
  }
  .ch-fig .f-body {

  .ch-fig .f-leg { top: 46px; width: 9px; height: 9px; border-radius: 4px; background: var(--leg); }

  .shop-wallet {

  .buy-btn {

  /* 账户面板：邮箱登录 / 注册 */
  .auth-tabs { display: flex; gap: 8px; margin: 2px 0 14px; }
  .auth-tab {
    flex: 1; border: none; cursor: pointer; font-family: inherit;

    color: #d8b6d0;
    background: linear-gradient(180deg, rgba(74,22,66,.72), rgba(32,8,28,.88));
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.10);
    transition: color .15s ease, background .15s ease;
  }
  .auth-tab.on {
    color: #4a2a00;

  .auth-field input {
    width: 100%; box-sizing: border-box; font-family: inherit; font-size: 15px;

  .auth-hint { font-size: 11.5px; color: #a883a0; margin-bottom: 13px; letter-spacing: .3px; }

  /* 一次性提示条（第一次被追捕者逮住时弹出来） */
  #toast {
    position: fixed; left: 50%; top: 20%; z-index: 3; pointer-events: none;
    transform: translate(-50%, -10px);
    padding: 11px 26px 13px; border-radius: 18px; white-space: nowrap;
    font-size: 21px; letter-spacing: 1px; color: #ffe9a8;
    background: linear-gradient(180deg, rgba(124,26,42,.95), rgba(58,9,26,.97));
    box-shadow: inset 0 0 0 2.5px rgba(255,190,90,.8), 0 6px 0 rgba(0,0,0,.28),
                0 16px 30px rgba(0,0,0,.4);
    opacity: 0; transition: opacity .2s ease, transform .2s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  .hidden { display: none !important; }

  .card {
    width: min(94vw, 440px); padding: 30px 26px 26px;
    border-radius: 30px; text-align: center; position: relative;
    background: linear-gradient(180deg, #52144a 0%, #370e32 42%, #20071c 100%);

  .row-box {
    flex: 1; padding: 10px 6px 12px; border-radius: 14px;
    background: rgba(28,6,24,.5); box-shadow: inset 0 0 0 2px rgba(255,160,110,.25);
  }
  .row-box b { display: block; font-size: 22px; color: #fff; font-variant-numeric: tabular-nums; }
  .row-box span {
    display: block; margin-top: 3px; font-size: 11px; letter-spacing: 1px; color: #cfa0bd;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 700;
  }
  .row-box.gold b { color: #ffd93b; }

  @media (max-width: 430px) {
    .hud-value { font-size: 44px; }
    .logo-zh { font-size: 42px; }
    .score-big { font-size: 50px; }
    .card { padding: 26px 20px 22px; }
  }

  /* 窄屏（手机竖屏）：资源条靠右，别压到左上玩家卡；开跑按钮不许换行 */
  @media (max-width: 620px) {
    .res-bar { left: auto; right: 12px; transform: none; gap: 6px; top: 12px; }
    .res { height: 30px; font-size: 13px; gap: 5px; }
    .res .plus { width: 19px; height: 19px; line-height: 18px; font-size: 14px; }
    .ri { width: 17px; height: 17px; }
    .menu-profile { left: 12px; top: 12px; padding: 5px 12px 5px 5px; gap: 7px; }
    .menu-profile .avatar { width: 36px; height: 36px; }
    .pname { font-size: 13px; }
    .plevel { font-size: 10px; }
    .menu-col { top: 84px; }
    .menu-col.left { left: 12px; }
    .menu-col.right { right: 12px; }
    .side-btn { width: 60px; font-size: 10.5px; padding: 7px 0 5px; }
    .si { width: 28px; height: 28px; }
    .menu-logo { top: 12%; }
    .menu-logo .logo-zh { font-size: 40px; }
    .menu-logo .logo-en { font-size: 11px; letter-spacing: 5px; }
    .run-btn { padding: 13px 34px 15px; font-size: 24px; letter-spacing: 2px; white-space: nowrap; }
    .menu-keys { font-size: 10.5px; bottom: 2%; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vig"></div>

<div id="toast"></div>

<div id="hud">
  <div class="hud-score">
    <div class="hud-label">SCORE</div>
    <div class="hud-value" id="score">0</div>
    <div class="hud-dist"><span id="dist">0</span> M</div>
  </div>
  <div class="hud-right">
    <div class="coin-pill">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <radialGradient id="cg" cx="34%" cy="28%" r="72%">
            <stop offset="0" stop-color="#fffbe0"/>
            <stop offset=".42" stop-color="#ffd23f"/>
            <stop offset="1" stop-color="#e08a00"/>
          </radialGradient>
        </defs>
        <circle cx="20" cy="20" r="18.5" fill="#a85f00"/>
        <circle cx="20" cy="20" r="15.5" fill="url(#cg)"/>
        <circle cx="20" cy="20" r="12" fill="none" stroke="#fff6c9" stroke-width="1.6" opacity=".65"/>
        <path d="M20 9.5l3.1 6.6 7.2.9-5.3 4.9 1.4 7.1-6.4-3.5-6.4 3.5 1.4-7.1-5.3-4.9 7.2-.9z" fill="#fff8d0"/>
      </svg>
      <span id="coins">0</span>
    </div>
    <button class="btn-pause" id="btnPause" aria-label="暂停"><i></i><i></i></button>
  </div>
</div>

<div id="overlay">
  <div class="menu" id="cardStart">
    <!-- 顶部资源条 -->
    <div class="res-bar">
      <div class="res"><i class="ri ri-coin"></i><b id="menuCoin">800</b><span class="plus">+</span></div>
      <div class="res"><i class="ri ri-gem"></i><b id="menuGem">0</b><span class="plus">+</span></div>
      <div class="res"><i class="ri ri-key"></i><b id="menuKey">0</b><span class="plus">+</span></div>
    </div>

    <!-- 左上：玩家信息（点开账户面板） -->
    <button class="menu-profile" id="btnProfile">
      <div class="avatar" id="menuAvatar"></div>
      <div class="pinfo">
        <div class="pname"><span id="menuName">杰克</span><em class="plv">Lv.<b id="menuLevel">1</b></em></div>
        <div class="plevel" id="menuSub">游客 · 点此登录</div>
      </div>
    </button>

    <!-- 左侧功能 -->
    <div class="menu-col left">
      <button class="side-btn" id="btnChars">
        <i class="si si-char"></i><span>角色</span>
      </button>
      <button class="side-btn" id="btnShop">
        <i class="si si-shop"></i><span>商店</span>
        <em class="badge" id="walletChip">0</em>
      </button>
      <button class="side-btn soon" data-soon="排行榜">
        <i class="si si-rank"></i><span>排行</span>
      </button>
    </div>

    <!-- 右侧功能 -->
    <div class="menu-col right">
      <button class="side-btn soon" data-soon="宝物">
        <i class="si si-treasure"></i><span>宝物</span>
      </button>
      <button class="side-btn soon" data-soon="竞技场">
        <i class="si si-vs"></i><span>竞技场</span>
      </button>
      <button class="side-btn soon" data-soon="社团">
        <i class="si si-club"></i><span>社团</span>
      </button>
    </div>

    <!-- 中间 logo -->
    <div class="menu-logo">
      <div class="logo-zh">地铁跑酷</div>
      <div class="logo-en">SUBWAY SURFERS</div>
    </div>

    <!-- 底部 -->
    <button class="run-btn" id="btnStart">点击开跑！</button>
    <div class="menu-keys">
      <kbd>←</kbd><kbd>→</kbd>换道 · <kbd>↑</kbd>跳跃 · <kbd>↓</kbd>翻滚
    </div>
  </div>

  <div class="card hidden" id="cardOver">
    <div class="over-banner">游戏结束</div>
    <div class="score-cap">SCORE</div>
    <div class="score-big" id="oScore">0</div>
    <div class="rows">
      <div class="row-box"><b id="oDist">0</b><span>距离 M</span></div>
      <div class="row-box gold"><b id="oCoins">0</b><span>金币</span></div>
      <div class="row-box"><b id="oBest">0</b><span>最高分</span></div>
    </div>
    <button class="btn blue" id="btnRetry">再来一次</button>
    <button class="btn ghost" id="btnMenu">返回主菜单</button>
    <div class="tip">按 <kbd>R</kbd> 或 <kbd>Enter</kbd> 快速重开</div>
  </div>

  <div class="card hidden" id="cardChars">
    <div class="panel-title">角色</div>
    <div class="panel-sub">选中即切换，未解锁的去商店看看</div>
    <div class="ch-grid" id="chGrid"></div>
    <button class="btn blue" id="btnCharsBack">返回</button>
  </div>

  <div class="card hidden" id="cardShop">
    <div class="panel-title">商店</div>
    <div class="shop-wallet">金币 <b id="shopWallet">0</b></div>
    <div class="shop-list" id="shopList"></div>
    <button class="btn blue" id="btnShopBack">返回</button>
  </div>

  <!-- 账户：邮箱登录 / 注册 -->
  <div class="card hidden" id="cardLogin">
    <div class="panel-title">账户</div>
    <div class="panel-sub" id="authSub">登录后金币、角色、最高分都跟着账号走</div>

    <div class="auth-tabs" id="authTabs">
      <button class="auth-tab on" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="reg">注册</button>
    </div>

    <div class="auth-form" id="authForm">
      <label class="auth-field">
        <span>邮箱</span>
        <input id="authEmail" type="email" inputmode="email" autocomplete="username"
               placeholder="you@example.com" spellcheck="false" />
      </label>
      <label class="auth-field">
        <span>密码</span>
        <input id="authPass" type="password" autocomplete="current-password" placeholder="至少 6 位" />
      </label>
      <label class="auth-field hidden" id="authPass2Row">
        <span>确认密码</span>
        <input id="authPass2" type="password" autocomplete="new-password" placeholder="再输一次" />
      </label>
      <div class="auth-err" id="authErr"></div>
      <button class="btn blue" id="authSubmit">登录</button>
      <button class="btn ghost" id="authBack">返回</button>
    </div>

    <div class="auth-user hidden" id="authUser">
      <div class="auth-user-top">
        <div class="auth-avatar" id="authAvatar"></div>
        <div>
          <div class="auth-mail" id="authMail">—</div>
          <div class="auth-stat" id="authStat">—</div>
        </div>
      </div>
      <div class="auth-hint">数据存在这台设备的浏览器里，换设备不同步</div>
      <button class="btn ghost" id="btnLogout">退出登录</button>
      <button class="btn blue" id="btnAuthBack">返回</button>
    </div>

    <div class="auth-note">密码只在本机校验，不上传，也找不回来</div>
  </div>

  <div class="card hidden" id="cardPause">
    <div class="over-banner" style="background:linear-gradient(180deg,#63d2ff,#1f7ec4 55%,#14548c);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),0 6px 0 #0b3a5f,0 14px 24px rgba(0,0,0,.45)">暂停中</div>
    <div style="height:10px"></div>
    <button class="btn" id="btnResume">继续游戏</button>
    <div class="tip">按 <kbd>P</kbd> 继续</div>
  </div>
</div>

<script src="./three.min.js"></script>
<script src="./game.js"></script>
</body>
</html>
